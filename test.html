<!DOCTYPE html>
<html>
<head>
<style>
.relative { position: relative; }
.overflow-hidden { overflow: hidden; }
.fixed { position: fixed; }
.inset-0 { top: 0; right: 0; bottom: 0; left: 0; }
.z-50 { z-index: 50; }
.bg-red { background: red; }
</style>
</head>
<body>
<div class="relative overflow-hidden" style="width: 100px; height: 100px; background: blue;">
  <div class="fixed inset-0 z-50 bg-red"></div>
</div>
</body>
</html>
